name: Build Sakura Atlas Desktop

# The lightweight SPY-native application is isolated from the legacy crypto
# package. Trigger manually; use the smoke check before distributing an EXE.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'sakura_atlas.py'
      - 'src/ai_trading_lab/spy_research.py'
      - 'requirements-atlas.txt'
      - '.github/workflows/build-atlas-windows.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-atlas.txt
      - name: Install desktop dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-atlas.txt
          python -m pip install "pyinstaller>=6,<7"
      - name: Unit tests and desktop headless smoke
        shell: pwsh
        run: |
          python -m pip install pytest
          $env:PYTHONPATH = 'src'
          python -m pytest -q tests/test_spy_research.py
          python sakura_atlas.py --check
      - name: Build native single-file EXE
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name SakuraAtlas --paths src --collect-all yfinance sakura_atlas.py
          if (!(Test-Path "dist/SakuraAtlas.exe")) { throw "Missing desktop executable" }
      - name: Smoke test frozen app
        shell: pwsh
        run: |
          & ".\dist\SakuraAtlas.exe" --check
          if ($LASTEXITCODE -ne 0) { throw "Frozen SakuraAtlas --check failed" }
      - name: Upload verified desktop EXE
        uses: actions/upload-artifact@v4
        with:
          name: SakuraAtlas-Windows-x64
          path: dist/SakuraAtlas.exe
          if-no-files-found: error
