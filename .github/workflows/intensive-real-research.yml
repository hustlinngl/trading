name: Intensive Real Research


on:
  workflow_dispatch:
    inputs:
      start:
        description: UTC start date
        required: false
        default: '2022-01-01'
      end:
        description: UTC end date
        required: false
        default: ''
      trials:
        description: Master tuning trials per asset
        required: false
        default: '60'
  schedule:
    - cron: '17 4 * * 0'

concurrency:
  group: intensive-real-research
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore persistent research ledger
        run: |
          mkdir -p data
          git fetch --no-tags origin refs/heads/research-ledger:refs/remotes/origin/research-ledger
          git show refs/remotes/origin/research-ledger:research_ledger.json > data/research_ledger.json
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("data/research_ledger.json")
          ledger = json.loads(path.read_text(encoding="utf-8"))
          if not isinstance(ledger, dict) or ledger.get("schema_version") != 2:
              raise SystemExit("Persistent research ledger has an unsupported schema; refusing to reset research governance.")
          print("research-ledger-restored", {"total_trials": ledger.get("total_trials", 0), "holdout_accesses": len(ledger.get("holdout_accesses", []))})
          PY

      - name: Compile and import check
        run: |
          python -m compileall -q src run_intensive_real_research.py
          python - <<'PY'
          from ai_trading_lab.config import load_settings
          from ai_trading_lab.engine import AdaptiveEngine
          from ai_trading_lab.master_tuner import master_tune
          print("core-import-ok", load_settings().timeframe, AdaptiveEngine.__name__, callable(master_tune))
          PY

      - name: Run adversarial integrity gate
        run: python run_adversarial_integrity.py

      - name: Run intensive real-data research
        env:
          INPUT_START: ${{ inputs.start }}
          INPUT_END: ${{ inputs.end }}
          INPUT_TRIALS: ${{ inputs.trials }}
        run: |
          START_DATE="${INPUT_START:-2022-01-01}"
          END_DATE="${INPUT_END:-}"
          TRIALS="${INPUT_TRIALS:-60}"
          START_DATE=${START_DATE:-2022-01-01}
          END_DATE=${END_DATE:-$(date -u +%F)}
          TRIALS=${TRIALS:-60}
          python run_intensive_real_research.py \
            --symbols BTC/USDT,ETH/USDT,BNB/USDT,SOL/USDT,XRP/USDT,ADA/USDT,DOGE/USDT,LINK/USDT \
            --timeframe 15m \
            --start "$START_DATE" \
            --end "$END_DATE" \
            --trials "$TRIALS" \
            --holdout-frac 0.15 \
            --require-all-assets
      - name: Run cross-exchange transfer validation
        run: |
          python run_cross_exchange_validation.py --trials 24 --holdout-frac 0.15

      - name: Upload research reports
        uses: actions/upload-artifact@v4
        with:
          name: intensive-real-research-${{ github.run_id }}
          path: |
            logs/intensive_real/**
            data/intensive_real/merged/**
          if-no-files-found: error

      - name: Persist research ledger across runs
        if: always()
        env:
          LEDGER_BRANCH: research-ledger
        run: |
          set -euo pipefail
          test -s data/research_ledger.json
          python - <<'PY'
          import json
          from pathlib import Path
          ledger = json.loads(Path("data/research_ledger.json").read_text(encoding="utf-8"))
          if not isinstance(ledger, dict) or ledger.get("schema_version") != 2:
              raise SystemExit("Research ledger schema changed or became corrupt; refusing to persist/reset it.")
          PY
          git fetch --no-tags origin "refs/heads/${LEDGER_BRANCH}:refs/remotes/origin/${LEDGER_BRANCH}"
          git worktree add --detach "$RUNNER_TEMP/research-ledger" "refs/remotes/origin/${LEDGER_BRANCH}"
          install -m 600 data/research_ledger.json "$RUNNER_TEMP/research-ledger/research_ledger.json"
          cd "$RUNNER_TEMP/research-ledger"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research_ledger.json
          if git diff --cached --quiet; then
            echo "Research ledger unchanged."
            exit 0
          fi
          git commit -m "chore: persist research governance ledger from run ${GITHUB_RUN_ID}"
          git push origin "HEAD:refs/heads/${LEDGER_BRANCH}"

