name: Autonomous Research Cycle

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

concurrency:
  group: autonomous-research
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -e .[full]
      - name: Run safe autonomous cycle
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          PAPER_ONLY: 'true'
          SANDBOX: 'true'
          # GitHub-hosted runners can be geo-restricted from exchange APIs (e.g. Binance 451).
          # Exercise the full autonomous pipeline deterministically without network access.
          AUTONOMOUS_OFFLINE: 'true'
        run: python -m ai_trading_lab.main autonomous --config config.yaml --cycles 1
      - name: Upload research artifacts
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-research-${{ github.run_id }}
          path: |
            logs/
            models/
            data/*.sqlite
          if-no-files-found: ignore
