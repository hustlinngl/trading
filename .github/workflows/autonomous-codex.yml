name: Autonomous Codex engineering (draft PR)

on:
  workflow_dispatch:
  schedule:
    # Starts at 05:05 Italian time on 2026-10-12; then every six hours.
    - cron: '5 3,9,15,21 * * *'

concurrency:
  group: autonomous-codex-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  edit:
    if: github.event_name == 'workflow_dispatch' || vars.AUTONOMOUS_CODEX_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 110
    outputs:
      changed: ${{ steps.patch.outputs.changed }}
    steps:
      - name: Verify consent, credentials and run window
        id: gate
        shell: bash
        env:
          API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ -z "$API_KEY" ]]; then
            echo 'Missing OPENAI_API_KEY repository secret.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ "$EVENT" == 'schedule' ]]; then
            now=$(date -u +%s)
            start=$(date -u -d '2026-10-12T03:05:00Z' +%s)
            end=$(date -u -d '2026-10-19T03:05:00Z' +%s)
            if (( now < start || now >= end )); then
              echo 'Outside the seven-day authorized window: no API call.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          echo 'run=true' >> "$GITHUB_OUTPUT"

      - name: Check out default branch without persistent GitHub credentials
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Resume previous autonomous work without touching main
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if git fetch --no-tags origin 'refs/heads/agent/autonomous-codex:refs/remotes/origin/agent/autonomous-codex'; then
            git switch -C agent/autonomous-codex origin/agent/autonomous-codex
          else
            git switch -C agent/autonomous-codex origin/main
          fi
          git show origin/main:.github/agents/autonomous-next-action.md > .codex-current-mission.md

      - name: Prepare Python test environment before authenticating Codex
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install test dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pyflakes==4.0.3

      - name: Perform autonomous engineering
        if: steps.gate.outputs.run == 'true'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ':workspace'
          codex-args: '["--search"]'
          safety-strategy: drop-sudo
          prompt-file: .codex-current-mission.md
          output-file: .codex-last-run.md

      - name: Verify code rather than relying on agent claims
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          python -m pyflakes src
          python -m compileall -q src signal_dashboard.py
          timeout 1200 python -m pytest -q
          python run_adversarial_integrity.py
          python signal_dashboard.py --once

      - name: Generate bounded, reviewable patch
        if: steps.gate.outputs.run == 'true'
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .codex-current-mission.md .codex-last-run.md
          git add -A
          python - <<'PY'
          import pathlib, re, subprocess
          names = [p for p in subprocess.check_output(
              ['git', 'diff', '--cached', '--name-only', '-z']
          ).decode().split('\0') if p]
          prohibited = [
              p for p in names if p.startswith((
                  '.github/workflows/', '.github/agents/', 'data/', 'models/',
                  'logs/', 'dist/', 'release/', 'build/'
              )) or p == 'AGENTS.md' or
              pathlib.PurePosixPath(p).name.startswith(('.env', 'id_rsa', 'id_ed25519')) or
              pathlib.PurePosixPath(p).suffix.lower() in ('.pem', '.key', '.p12', '.pfx')
          ]
          if prohibited:
              raise SystemExit('Prohibited paths: ' + repr(prohibited))
          if len(names) > 45:
              raise SystemExit('Too many files modified without review')
          patch = subprocess.check_output(['git', 'diff', '--cached', '--binary'])
          if len(patch) > 300000:
              raise SystemExit('Patch is too large for unattended review')
          if re.search(rb'-----BEGIN (?:RSA |OPENSSH |EC )?PRIVATE KEY-----', patch):
              raise SystemExit('Possible private key found in changes')
          pathlib.Path('/tmp/autonomous-change.patch').write_bytes(patch)
          print('Files:', len(names), 'patch bytes:', len(patch))
          PY
          if [[ -s /tmp/autonomous-change.patch ]]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No publishable change this run.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload patch for isolated publisher
        if: steps.patch.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: autonomous-codex-patch
          path: /tmp/autonomous-change.patch
          retention-days: 3
          if-no-files-found: error

  publish:
    needs: edit
    if: needs.edit.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: autonomous-codex-patch
          path: /tmp

      - name: Publish change on durable candidate branch only
        shell: bash
        run: |
          set -euo pipefail
          if git fetch --no-tags origin 'refs/heads/agent/autonomous-codex:refs/remotes/origin/agent/autonomous-codex'; then
            git switch -C agent/autonomous-codex origin/agent/autonomous-codex
          else
            git switch -C agent/autonomous-codex origin/main
          fi
          git apply --index --binary /tmp/autonomous-change.patch
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'agent: evidence-driven next product improvement'
            git push origin HEAD:refs/heads/agent/autonomous-codex
          fi

      - name: Create one persistent draft PR, never merge automatically
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          number=$(gh pr list --head agent/autonomous-codex --base main --state open --json number --jq '.[0].number // empty')
          if [[ -z "$number" ]]; then
            gh pr create --draft --base main --head agent/autonomous-codex \
              --title 'Autonomous Codex: evidence-driven engineering improvements' \
              --body 'Unattended candidate work on one durable branch. Verify the actual diff, tests and market-evidence limitations independently. **Do not merge without human review, current CI and separate Windows-build validation.** No order execution, deployments or release authorization. Seven-day schedule; see docs/AUTONOMOUS_CODEX_SETUP.md.'
          else
            echo "Updated draft PR #$number" >> "$GITHUB_STEP_SUMMARY"
          fi
