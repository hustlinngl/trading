name: Build Windows EXE # final portable package build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: read

# Only the newest package build for a branch/ref is useful.
# This prevents expensive historical-cache builds from piling up after UI/data commits.
concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generate bundled historical cache
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import pandas as pd
          from ai_trading_lab.binance_vision import (
              download_range, merge_archives, rolling_closed_history_window,
          )

          # Use complete monthly archives for the two-year window and daily archives
          # for the latest closed candles in the current UTC month.
          symbols = [
              "BTC/USDT", "ETH/USDT", "BNB/USDT", "SOL/USDT", "XRP/USDT",
              "ADA/USDT", "DOGE/USDT", "AVAX/USDT", "LINK/USDT", "DOT/USDT",
              "LTC/USDT", "BCH/USDT", "ATOM/USDT", "UNI/USDT", "ETC/USDT",
          ]
          window = rolling_closed_history_window(months=24)
          start = window["start"]
          monthly_end = window["monthly_end"]
          recent_start = window["recent_start"]
          end = window["end"]
          print("bundled-history-window-utc", start, end, "monthly-through", monthly_end)
          Path("logs").mkdir(parents=True, exist_ok=True)
          Path("logs/bundled_history_window.json").write_text(
              json.dumps(window, indent=2), encoding="utf-8"
          )

          from concurrent.futures import ThreadPoolExecutor, as_completed

          out = Path("data/historical")
          out.mkdir(parents=True, exist_ok=True)

          def build_symbol_history(symbol):
              archives = download_range(
                  symbol,
                  "15m",
                  start,
                  monthly_end,
                  market="spot",
                  out_dir="data/raw/binance",
                  timeout=90,
                  verify_checksum=True,
                  exact=False,
              )
              if recent_start <= end:
                  archives.extend(download_range(
                      symbol,
                      "15m",
                      recent_start,
                      end,
                      market="spot",
                      out_dir="data/raw/binance",
                      timeout=90,
                      verify_checksum=True,
                      exact=True,
                  ))
              archives = list(dict.fromkeys(archives))
              frame = merge_archives(archives)
              if frame.empty or len(frame) < 5000:
                  raise RuntimeError(
                      f"Insufficient Binance Vision history for {symbol}: {len(frame)} bars"
                  )
              frame = frame.sort_values("timestamp")
              frame = frame[["timestamp", "open", "high", "low", "close", "volume"]].copy()
              path = out / f"{symbol.replace('/', '_')}_15m.csv"
              frame.to_csv(
                  path,
                  index=False,
                  date_format="%Y-%m-%dT%H:%M:%S%z",
              )
              return symbol, path, len(frame), frame["timestamp"].min(), frame["timestamp"].max()

          # Download a few independent symbols concurrently. The bound avoids hammering
          # Binance Vision while cutting the wall-clock time of this reproducible build step.
          with ThreadPoolExecutor(max_workers=4, thread_name_prefix="vision") as pool:
              futures = {pool.submit(build_symbol_history, symbol): symbol for symbol in symbols}
              for future in as_completed(futures):
                  symbol = futures[future]
                  try:
                      done_symbol, path, rows, start_ts, end_ts = future.result()
                      print(done_symbol, rows, start_ts, end_ts)
                  except Exception as exc:
                      raise RuntimeError(f"Historical cache build failed for {symbol}: {type(exc).__name__}: {exc}") from exc
          PY

      - name: Train and validate bundled signal assets
        shell: bash
        run: |
          python -m ai_trading_lab.main train-complete-all --config config.yaml --holdout-frac 0.15
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("logs/train_complete_all_report.json").read_text(encoding="utf-8"))
          window_path = Path("logs/bundled_history_window.json")
          history_window = json.loads(window_path.read_text(encoding="utf-8")) if window_path.exists() else {}
          expected = {"BTC/USDT","ETH/USDT","BNB/USDT","SOL/USDT","XRP/USDT","ADA/USDT","DOGE/USDT","AVAX/USDT","LINK/USDT","DOT/USDT","LTC/USDT","BCH/USDT","ATOM/USDT","UNI/USDT","ETC/USDT"}
          trained = {str(row.get("symbol")) for row in report if row.get("status") == "trained"}
          missing = sorted(expected - trained)
          ready = sorted(str(row.get("symbol")) for row in report if row.get("status") == "trained" and bool(row.get("production_ready")))
          not_ready = sorted(str(row.get("symbol")) for row in report if row.get("status") == "trained" and not bool(row.get("production_ready")))
          if missing:
              raise RuntimeError(f"Bundled model training did not produce all expected assets: {missing}")
          mode = "PRODUCTION-READY" if ready else "RESEARCH-ONLY — NO DEPLOYMENT-READY SIGNAL MODELS"
          errors = sorted(str(row.get("symbol")) for row in report if row.get("status") == "error")
          readiness_lines = [
              "Sakura Signal Terminal — model readiness",
              f"Package mode: {mode}",
              "Historical OHLCV window (UTC): " + (
                  f"{history_window.get('start')} through {history_window.get('end')}"
                  if history_window.get("start") and history_window.get("end")
                  else "unknown"
              ),
              f"Expected assets: {len(expected)}",
              f"Trained assets: {len(trained)}",
              f"Deployment-ready assets: {len(ready)}",
              "Validated assets: " + (", ".join(ready) if ready else "NONE"),
              "Training errors: " + (", ".join(errors) if errors else "NONE"),
              "",
              "A successful application build does not imply a profitable or validated strategy.",
              "When no asset passes the out-of-sample deployment gates, the app must expose zero LONG/SHORT signals.",
              "Do not lower readiness gates merely to make the executable build pass.",
          ]
          Path("logs/model_readiness.txt").write_text("\n".join(readiness_lines) + "\n", encoding="utf-8")
          print("\n".join(readiness_lines))
          if not ready:
              print("WARNING: Building a research-only executable. All unvalidated model bundles remain ineligible for public signals.")
          print("bundled-historical-assets-ok", len(trained), "production-ready", len(ready), "not-ready", len(not_ready))
          PY

      - name: Upload model readiness diagnostics when packaging is blocked
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: readiness-diagnostics-${{ github.run_number }}
          path: |
            logs/train_complete_all_report.json
            logs/test_report.json
            models/assets/**/base_holdout_report.json
            models/assets/**/trade_window_training_report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Verify dashboard imports
        shell: bash
        run: |
          python - <<'PY'
          import signal_dashboard
          from ai_trading_lab import live, live_tracker, deployment, data
          print("dashboard-imports-ok", signal_dashboard.APP_TITLE, live.LiveAssessment.__name__)
          PY

      - name: Build EXE
        shell: bash
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --onefile \
            --windowed \
            --name SakuraSignalTerminal \
            --paths src \
            --collect-submodules ai_trading_lab \
            --hidden-import ai_trading_lab.live \
            --hidden-import ai_trading_lab.live_tracker \
            --hidden-import ai_trading_lab.deployment \
            --hidden-import ai_trading_lab.data \
            --collect-data xgboost \
            --collect-binaries xgboost \
            --collect-all lightgbm \
            signal_dashboard.py

      - name: Stage frozen runtime data for functional test
        shell: pwsh
        run: |
          Copy-Item .\config.yaml .\dist\config.yaml
          New-Item -ItemType Directory -Force -Path .\dist\data\historical | Out-Null
          Copy-Item .\data\historical\*.csv .\dist\data\historical\
          New-Item -ItemType Directory -Force -Path .\dist\models\assets | Out-Null
          Copy-Item .\models\assets\* .\dist\models\assets\ -Recurse -Force
          Write-Host "Staged config, bundled history, and validated model assets beside the exact user-facing EXE."

      - name: Smoke test frozen executable
        shell: pwsh
        run: |
          $exe = Resolve-Path .\dist\SakuraSignalTerminal.exe
          if (-not (Test-Path $exe)) {
            throw "Frozen executable was not produced: $exe"
          }
          $sizeMb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          if ($sizeMb -lt 20) {
            throw "Frozen executable looks unexpectedly small: $sizeMb MB"
          }

          # Validate the exact windowed binary that users receive.
          $smoke = Start-Process -FilePath $exe -ArgumentList "--smoke-test" -Wait -PassThru
          if ($smoke.ExitCode -ne 0) {
            throw "Frozen executable smoke test failed with exit code $($smoke.ExitCode)"
          }
          Write-Host "Frozen executable smoke test passed: $sizeMb MB"

      - name: Functional frozen inference contract test
        shell: pwsh
        run: |
          $trainingReport = @(Get-Content .\logs\train_complete_all_report.json -Raw | ConvertFrom-Json)
          $readySymbols = @($trainingReport | Where-Object { $_.status -eq "trained" -and $_.production_ready -eq $true } | ForEach-Object { [string]$_.symbol })
          if ($readySymbols.Count -eq 0) {
            Write-Warning "No deployment-ready models exist; inference contract tests are not applicable. The packaged dashboard must remain signal-empty."
          } else {
            foreach ($symbol in $readySymbols) {
              $proc = Start-Process -FilePath .\dist\SakuraSignalTerminal.exe -ArgumentList "--self-test-inference --symbol $symbol" -Wait -PassThru -NoNewWindow
              if ($proc.ExitCode -ne 0) {
                throw "Frozen inference contract failed ($symbol), exit code $($proc.ExitCode)"
              }
            }
            Write-Host "Frozen inference contract passed for all $($readySymbols.Count) deployment-ready assets."
          }

      - name: Functional packaged dashboard smoke test
        shell: pwsh
        run: |
          # Validate the exact primary windowed binary over its local HTTP surface.
          $port = 8875
          $primary = Start-Process -FilePath .\dist\SakuraSignalTerminal.exe `
            -ArgumentList "--no-browser --host 127.0.0.1 --port $port" `
            -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 45; $i++) {
              try {
                $page = Invoke-WebRequest -Uri "http://127.0.0.1:$port/" -UseBasicParsing -TimeoutSec 2
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/health" -TimeoutSec 2
                $ready = $true
                break
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $ready) { throw "Packaged primary executable did not start on port $port" }
            if (-not $page.Content.Contains("Top 5 signals")) { throw "Packaged dashboard does not contain the focused Top 5 signals surface" }
            if (-not $page.Content.Contains("pick-stat-meter")) { throw "Packaged dashboard is missing the confidence result meter" }
            if (-not $health.ok) { throw "Packaged health endpoint did not report ok=true" }
            $state = $null
            $scanReady = $false
            for ($i = 0; $i -lt 120; $i++) {
              $state = Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/state?force=0" -TimeoutSec 20
              if (-not $state.scan_in_progress) {
                $scanReady = $true
                break
              }
              Start-Sleep -Seconds 1
            }
            if (-not $scanReady) {
              throw "Packaged executable scan did not complete within the functional-test window."
            }
            if (-not $state.ok) {
              throw "Packaged dashboard returned ok=false after scan: $($state.error)"
            }
            if ([int]$state.summary.model_backed_assets -lt 15) {
              throw "Packaged executable started but did not expose all 15 bundled model assets: $($state.summary.model_backed_assets)"
            }
            $trainingReport = @(Get-Content .\logs\train_complete_all_report.json -Raw | ConvertFrom-Json)
            $readySymbols = @($trainingReport | Where-Object { $_.status -eq "trained" -and $_.production_ready -eq $true } | ForEach-Object { [string]$_.symbol })
            if ($readySymbols.Count -eq 0) {
              if ([int]$state.summary.compatible_bundles -ne 0) {
                throw "Research-only build exposed compatible bundles although no asset passed deployment readiness."
              }
              if (@($state.signals).Count -ne 0) {
                throw "Research-only build emitted public trading signals from unvalidated assets."
              }
              Write-Host "Research-only package correctly exposes zero compatible bundles and zero public signals."
            } else {
              if ([int]$state.summary.compatible_bundles -lt 1) {
                throw "Ready models were trained but the packaged dashboard exposes no compatible production-ready signal bundles."
              }
              if ([int]$state.summary.compatible_bundles -gt $readySymbols.Count) {
                throw "Packaged dashboard reports more compatible bundles ($($state.summary.compatible_bundles)) than assets that passed deployment readiness ($($readySymbols.Count))."
              }

              foreach ($row in @($state.signals)) {
                $keys = @($row.PSObject.Properties.Name | Sort-Object)
                $keyString = $keys -join ","
                if ($keyString -ne "confidence,expected_return,horizon_bars,price,signal,symbol") {
                  throw "Packaged dashboard exposed a non-canonical public signal payload: $keyString"
                }
                if ($readySymbols -notcontains [string]$row.symbol) {
                  throw "Packaged dashboard exposed a signal from a bundle that failed deployment readiness: $($row.symbol)"
                }
              }
            }

            $symbols = @(
              "BTC/USDT","ETH/USDT","BNB/USDT","SOL/USDT","XRP/USDT",
              "ADA/USDT","DOGE/USDT","AVAX/USDT","LINK/USDT","DOT/USDT",
              "LTC/USDT","BCH/USDT","ATOM/USDT","UNI/USDT","ETC/USDT"
            )
            foreach ($symbol in $symbols) {
              $encoded = [System.Uri]::EscapeDataString($symbol)
              $history = Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/history?symbol=$encoded&limit=120" -TimeoutSec 5
              if ($history.bars.Count -lt 100) { throw "Insufficient packaged history for ${symbol}: $($history.bars.Count) bars" }
            }
            Write-Host "Functional packaged dashboard smoke test passed for the expanded historical asset set."
          } finally {
            Stop-Process -Id $primary.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Assemble portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item .\dist\SakuraSignalTerminal.exe .\release\SakuraSignalTerminal.exe
          Copy-Item .\config.yaml .\release\config.yaml
          New-Item -ItemType Directory -Force -Path .\release\data\historical | Out-Null
          Copy-Item .\data\historical\*.csv .\release\data\historical\
          New-Item -ItemType Directory -Force -Path .\release\models\assets | Out-Null
          Copy-Item .\models\assets\* .\release\models\assets\ -Recurse -Force
          Copy-Item .\SETUP_WINDOWS.md .\release\SETUP_WINDOWS.md
          Copy-Item .\README.md .\release\README.md
          Copy-Item .\logs\model_readiness.txt .\release\MODEL_READINESS.txt
          $trainingReport = @(Get-Content .\logs\train_complete_all_report.json -Raw | ConvertFrom-Json)
          $readySymbols = @($trainingReport | Where-Object { $_.status -eq "trained" -and $_.production_ready -eq $true } | ForEach-Object { [string]$_.symbol })
          if ($readySymbols.Count -gt 0) {
            $mode = "PRODUCTION-READY MODELS PRESENT"
            $readyList = $readySymbols -join ", "
          } else {
            $mode = "RESEARCH-ONLY - NO VALIDATED SIGNAL MODELS"
            $readyList = "NONE"
          }
          @"
          Sakura Signal Terminal 0.9.40

          Package mode: $mode
          Deployment-ready assets: $($readySymbols.Count)
          Validated assets: $readyList

          Launch SakuraSignalTerminal.exe.
          The executable is read-only: it exposes no order endpoints.
          Keep config.yaml beside the EXE.

          Model bundles are shipped under models/assets/<SYMBOL>/.
          The dashboard checks bundle provenance and deployment readiness before publishing signals.
          A successful software build is not evidence of profitable trading.
          If no validated model is listed above, the terminal intentionally emits no LONG/SHORT signals.
          See MODEL_READINESS.txt for the training-readiness summary.
          "@ | Set-Content .\release\RUN.txt -Encoding UTF8

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: SakuraSignalTerminal-Windows-x64
          path: release/
          if-no-files-found: error
          retention-days: 14
