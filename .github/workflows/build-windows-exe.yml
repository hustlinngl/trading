name: Build Windows EXE # final portable package build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generate bundled historical cache
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          from ai_trading_lab.binance_vision import download_range, merge_archives

          symbols = ["BTC/USDT", "ETH/USDT", "BNB/USDT", "SOL/USDT", "XRP/USDT"]
          start = "2025-10-01"
          end = "2026-10-01"

          out = Path("data/historical")
          out.mkdir(parents=True, exist_ok=True)

          for symbol in symbols:
              archives = download_range(
                  symbol,
                  "15m",
                  start,
                  end,
                  market="spot",
                  out_dir="data/raw/binance",
                  timeout=90,
                  verify_checksum=True,
                  exact=False,
              )
              frame = merge_archives(archives)
              if frame.empty or len(frame) < 5000:
                  raise RuntimeError(f"Insufficient Binance Vision history for {symbol}: {len(frame)} bars")
              frame = frame.sort_values("timestamp")
              frame = frame[["timestamp", "open", "high", "low", "close", "volume"]].copy()
              frame.to_csv(
                  out / f"{symbol.replace('/', '_')}_15m.csv",
                  index=False,
                  date_format="%Y-%m-%dT%H:%M:%S%z",
              )
              print(symbol, len(frame), frame["timestamp"].min(), frame["timestamp"].max())
          PY

      - name: Verify dashboard imports
        shell: bash
        run: |
          python - <<'PY'
          import signal_dashboard
          from ai_trading_lab import live, live_tracker, deployment, data
          print("dashboard-imports-ok", signal_dashboard.APP_TITLE, live.LiveAssessment.__name__)
          PY

      - name: Build EXE
        shell: bash
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --onefile \
            --windowed \
            --name SakuraSignalTerminal \
            --paths src \
            --collect-submodules ai_trading_lab \
            --hidden-import ai_trading_lab.live \
            --hidden-import ai_trading_lab.live_tracker \
            --hidden-import ai_trading_lab.deployment \
            --hidden-import ai_trading_lab.data \
            --collect-data xgboost \
            --collect-binaries xgboost \
            --collect-all lightgbm \
            signal_dashboard.py

      - name: Stage frozen runtime data for functional test
        shell: pwsh
        run: |
          Copy-Item .\config.yaml .\dist\config.yaml
          New-Item -ItemType Directory -Force -Path .\dist\data\historical | Out-Null
          Copy-Item .\data\historical\*.csv .\dist\data\historical\
          Write-Host "Staged config and bundled history beside the exact user-facing EXE."

      - name: Smoke test frozen executable
        shell: pwsh
        run: |
          $exe = Resolve-Path .\dist\SakuraSignalTerminal.exe
          if (-not (Test-Path $exe)) {
            throw "Frozen executable was not produced: $exe"
          }
          $sizeMb = [math]::Round((Get-Item $exe).Length / 1MB, 1)
          if ($sizeMb -lt 20) {
            throw "Frozen executable looks unexpectedly small: $sizeMb MB"
          }

          # Validate the exact windowed binary that users receive.
          $smoke = Start-Process -FilePath $exe -ArgumentList "--smoke-test" -Wait -PassThru
          if ($smoke.ExitCode -ne 0) {
            throw "Frozen executable smoke test failed with exit code $($smoke.ExitCode)"
          }
          Write-Host "Frozen executable smoke test passed: $sizeMb MB"

      - name: Functional packaged dashboard smoke test
        shell: pwsh
        run: |
          # Validate the exact primary windowed binary over its local HTTP surface.
          $port = 8875
          $primary = Start-Process -FilePath .\dist\SakuraSignalTerminal.exe `
            -ArgumentList "--no-browser --host 127.0.0.1 --port $port" `
            -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 45; $i++) {
              try {
                $page = Invoke-WebRequest -Uri "http://127.0.0.1:$port/" -UseBasicParsing -TimeoutSec 2
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/health" -TimeoutSec 2
                $ready = $true
                break
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $ready) { throw "Packaged primary executable did not start on port $port" }
            if (-not $page.Content.Contains("Top 5 signals")) { throw "Packaged dashboard does not contain the focused Top 5 signals surface" }
            if (-not $page.Content.Contains("pick-stat-meter")) { throw "Packaged dashboard is missing the confidence result meter" }
            if (-not $health.ok) { throw "Packaged health endpoint did not report ok=true" }

            $symbols = @("BTC/USDT","ETH/USDT","BNB/USDT","SOL/USDT","XRP/USDT")
            foreach ($symbol in $symbols) {
              $encoded = [System.Uri]::EscapeDataString($symbol)
              $history = Invoke-RestMethod -Uri "http://127.0.0.1:$port/api/history?symbol=$encoded&limit=120" -TimeoutSec 5
              if ($history.bars.Count -lt 100) { throw "Insufficient packaged history for ${symbol}: $($history.bars.Count) bars" }
            }
            Write-Host "Functional packaged dashboard smoke test passed for all five historical assets."
          } finally {
            Stop-Process -Id $primary.Id -Force -ErrorAction SilentlyContinue
          }
      - name: Assemble portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item .\dist\SakuraSignalTerminal.exe .\release\SakuraSignalTerminal.exe
          Copy-Item .\config.yaml .\release\config.yaml
          New-Item -ItemType Directory -Force -Path .\release\data\historical | Out-Null
          Copy-Item .\data\historical\*.csv .\release\data\historical\
          Copy-Item .\SETUP_WINDOWS.md .\release\SETUP_WINDOWS.md
          Copy-Item .\README.md .\release\README.md
          @"
          Sakura Signal Terminal 0.9.31
          
          Launch SakuraSignalTerminal.exe.
          The executable is read-only: it exposes no order endpoints.
          
          Keep config.yaml beside the EXE.
          Trained model bundles are intentionally external and should remain
          beside the executable in the repository's expected model layout.
          "@ | Set-Content .\release\RUN.txt -Encoding UTF8

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: SakuraSignalTerminal-Windows-x64
          path: release/
          if-no-files-found: error
          retention-days: 14
