name: Build Windows EXE # final portable package build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generate bundled historical cache
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import io
          import zipfile
          from datetime import datetime, timezone
          from pathlib import Path
          import requests

          out = Path("data/historical")
          out.mkdir(parents=True, exist_ok=True)
          targets = {
              "BTC/USDT": "BTCUSDT",
              "ETH/USDT": "ETHUSDT",
              "BNB/USDT": "BNBUSDT",
              "SOL/USDT": "SOLUSDT",
              "XRP/USDT": "XRPUSDT",
          }

          # Six completed months gives the packaged dashboard a real multi-month
          # 15m history without relying on the geo-restricted REST endpoint.
          months = ["2026-04", "2026-05", "2026-06", "2026-07", "2026-08", "2026-09"]
          base = "https://data.binance.vision/data/spot/monthly/klines"
          headers = {"User-Agent": "adaptive-ai-trading-lab/0.9.17"}

          for symbol, api_symbol in targets.items():
              rows = {}
              for month in months:
                  url = f"{base}/{api_symbol}/15m/{api_symbol}-15m-{month}.zip"
                  response = requests.get(url, timeout=60, headers=headers)
                  response.raise_for_status()
                  with zipfile.ZipFile(io.BytesIO(response.content)) as archive:
                      members = [n for n in archive.namelist() if n.lower().endswith(".csv")]
                      if not members:
                          raise RuntimeError(f"No CSV inside {url}")
                      with archive.open(members[0]) as raw:
                          text = io.TextIOWrapper(raw, encoding="utf-8", newline="")
                          reader = csv.reader(text)
                          for row in reader:
                              if not row or row[0].lower() in {"open_time", "open time"}:
                                  continue
                              if len(row) < 6:
                                  continue
                              try:
                                  ts = int(row[0])
                                  float(row[1]); float(row[2]); float(row[3]); float(row[4]); float(row[5])
                              except (TypeError, ValueError):
                                  continue
                              rows[ts] = row

              ordered = [rows[k] for k in sorted(rows)]
              if len(ordered) < 5000:
                  raise RuntimeError(f"Insufficient Binance Vision history for {symbol}: {len(ordered)} bars")

              slug = symbol.replace("/", "_").replace(":", "_")
              path = out / f"{slug}_15m.csv"
              with path.open("w", newline="", encoding="utf-8") as fh:
                  writer = csv.writer(fh)
                  writer.writerow(["timestamp", "open", "high", "low", "close", "volume"])
                  for row in ordered:
                      stamp = datetime.fromtimestamp(int(row[0]) / 1000, tz=timezone.utc).isoformat()
                      writer.writerow([stamp, row[1], row[2], row[3], row[4], row[5]])
              print(symbol, len(ordered), path)
          PY

      - name: Build EXE
        shell: bash
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --onefile \
            --windowed \
            --name SakuraSignalTerminal \
            --paths src \
            --collect-submodules ai_trading_lab \
            --collect-all xgboost \
            --collect-all lightgbm \
            signal_dashboard.py

      - name: Smoke test frozen executable
        shell: pwsh
        run: |
          $exe = Resolve-Path .\dist\SakuraSignalTerminal.exe
          if (-not (Test-Path $exe)) {
            throw "Frozen executable was not produced: $exe"
          }

          # The primary binary is intentionally windowed, so startup stderr is hidden in CI.
          # Build a temporary console twin to expose any frozen-import/startup failure.
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --console `
            --name SakuraSignalTerminalSmoke `
            --paths src `
            --collect-submodules ai_trading_lab `
            --collect-all xgboost `
            --collect-all lightgbm `
            signal_dashboard.py

          $output = & .\dist\SakuraSignalTerminalSmoke.exe --smoke-test 2>&1
          $exitCode = $LASTEXITCODE
          $output | Out-String | Write-Host
          if ($exitCode -ne 0) {
            throw "Frozen executable startup failed with exit code $exitCode. Output:`n$output"
          }

          Write-Host "Primary windowed executable produced successfully: $exe"

      - name: Assemble portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item .\dist\SakuraSignalTerminal.exe .\release\SakuraSignalTerminal.exe
          Copy-Item .\config.yaml .\release\config.yaml
          New-Item -ItemType Directory -Force -Path .\release\data\historical | Out-Null
          Copy-Item .\data\historical\*.csv .\release\data\historical\
          Copy-Item .\SETUP_WINDOWS.md .\release\SETUP_WINDOWS.md
          Copy-Item .\README.md .\release\README.md
          @"
          Sakura Signal Terminal 0.9.17
          
          Launch SakuraSignalTerminal.exe.
          The executable is read-only: it exposes no order endpoints.
          
          Keep config.yaml beside the EXE.
          Trained model bundles are intentionally external and should remain
          beside the executable in the repository's expected model layout.
          "@ | Set-Content .\release\RUN.txt -Encoding UTF8

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: SakuraSignalTerminal-Windows-x64
          path: release/
            data/historical/
          if-no-files-found: error
          retention-days: 14
