name: Build Windows EXE # final portable package build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Generate bundled historical cache
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import pandas as pd
          from ai_trading_lab.binance_vision import download_range, merge_archives

          symbols = ["BTC/USDT", "ETH/USDT", "BNB/USDT", "SOL/USDT", "XRP/USDT"]
          start = "2025-10-01"
          end = "2026-10-01"

          out = Path("data/historical")
          out.mkdir(parents=True, exist_ok=True)

          for symbol in symbols:
              archives = download_range(
                  symbol,
                  "15m",
                  start,
                  end,
                  market="spot",
                  out_dir="data/raw/binance",
                  timeout=90,
                  verify_checksum=True,
                  exact=False,
              )
              frame = merge_archives(archives)
              if frame.empty or len(frame) < 5000:
                  raise RuntimeError(f"Insufficient Binance Vision history for {symbol}: {len(frame)} bars")
              frame = frame.sort_values("timestamp")
              frame = frame[["timestamp", "open", "high", "low", "close", "volume"]].copy()
              frame.to_csv(
                  out / f"{symbol.replace('/', '_')}_15m.csv",
                  index=False,
                  date_format="%Y-%m-%dT%H:%M:%S%z",
              )
              print(symbol, len(frame), frame["timestamp"].min(), frame["timestamp"].max())
          PY

      - name: Build EXE
        shell: bash
        run: |
          pyinstaller \
            --noconfirm \
            --clean \
            --onefile \
            --windowed \
            --name SakuraSignalTerminal \
            --paths src \
            --collect-submodules ai_trading_lab \
            --collect-all xgboost \
            --collect-all lightgbm \
            signal_dashboard.py

      - name: Smoke test frozen executable
        shell: pwsh
        run: |
          $exe = Resolve-Path .\dist\SakuraSignalTerminal.exe
          if (-not (Test-Path $exe)) {
            throw "Frozen executable was not produced: $exe"
          }

          # The primary binary is intentionally windowed, so startup stderr is hidden in CI.
          # Build a temporary console twin to expose any frozen-import/startup failure.
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --console `
            --name SakuraSignalTerminalSmoke `
            --paths src `
            --collect-submodules ai_trading_lab `
            --collect-all xgboost `
            --collect-all lightgbm `
            signal_dashboard.py

          $output = & .\dist\SakuraSignalTerminalSmoke.exe --smoke-test 2>&1
          $exitCode = $LASTEXITCODE
          $output | Out-String | Write-Host
          if ($exitCode -ne 0) {
            throw "Frozen executable startup failed with exit code $exitCode. Output:`n$output"
          }

          Write-Host "Primary windowed executable produced successfully: $exe"

      - name: Assemble portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item .\dist\SakuraSignalTerminal.exe .\release\SakuraSignalTerminal.exe
          Copy-Item .\config.yaml .\release\config.yaml
          New-Item -ItemType Directory -Force -Path .\release\data\historical | Out-Null
          Copy-Item .\data\historical\*.csv .\release\data\historical\
          Copy-Item .\SETUP_WINDOWS.md .\release\SETUP_WINDOWS.md
          Copy-Item .\README.md .\release\README.md
          @"
          Sakura Signal Terminal 0.9.17
          
          Launch SakuraSignalTerminal.exe.
          The executable is read-only: it exposes no order endpoints.
          
          Keep config.yaml beside the EXE.
          Trained model bundles are intentionally external and should remain
          beside the executable in the repository's expected model layout.
          "@ | Set-Content .\release\RUN.txt -Encoding UTF8

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: SakuraSignalTerminal-Windows-x64
          path: release/
            data/historical/
          if-no-files-found: error
          retention-days: 14
