[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-ai-trading-lab"
version = "0.9.23"
description = "Autonomous adaptive trading research platform with real-data research, strict validation and safe paper trading."
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "pyyaml>=6.0",
  "joblib>=1.4",
  "requests>=2.32",
  "ccxt>=4.5",
  "optuna>=4.0",
  "scipy>=1.14",
  "pyarrow>=17.0",
  "pytest>=8.0",
]

[project.optional-dependencies]
full = ["xgboost>=2.1", "lightgbm>=4.5", "ccxt>=4.5", "duckdb>=1.1", "plotly>=5.24", "polars>=1.8", "vectorbt>=0.27.2", "torch>=2.4", "stable-baselines3>=2.4", "gymnasium>=1.0", "websockets>=14.0"]

[project.scripts]
aitrader = "ai_trading_lab.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
